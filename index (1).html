<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Completion Time Lab</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#6b6a64;--acc:#2a5bd7;--acc-i:#fff;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--ink:#ecebe6;--mut:#9b9a92;--acc:#7fa2ff;--acc-i:#101010;--line:#3a3a37}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--ink:#ecebe6;--mut:#9b9a92;--acc:#7fa2ff;--acc-i:#101010;--line:#3a3a37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:1.4rem;margin:0 0 8px}p{margin:8px 0}.mut{color:var(--mut);font-size:.9rem}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer}
button.p{background:var(--acc);color:var(--acc-i);border-color:var(--acc);font-weight:600}
.q{font-size:2.4rem;text-align:center;margin:24px 0 12px;font-weight:600}
input[type=text]{width:100%;font-size:1.6rem;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
textarea{width:100%;height:110px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;margin-top:10px}
.foot{text-align:center;margin-top:16px}.foot button{border:none;background:none;color:var(--mut);font-size:.8rem;text-decoration:underline}
</style></head><body><main><div id="app"></div><div class="foot"><button id="rb">Researcher data</button></div></main>
<script>
var SHARED=[["48 + 27",75],["63 − 19",44],["12 × 14",168],["156 ÷ 12",13],["305 − 168",137],["27 × 6",162],["84 + 139",223],["18 × 15",270]];
var EASY=[["4 + 3",7],["9 − 5",4],["2 × 6",12]];
var HARD=[["76 × 43",3268],["912 ÷ 24",38],["29 × 64",1856]];
var LABEL=["Control","Easy","Difficult"];
var KEY="mathlab_rows",app=document.getElementById("app");
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return window._rows||[]}}
function save(r){window._rows=r;try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}}
var S={};
function rnd3(){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%3}
function parse(v){var n=parseFloat(String(v).replace(/,/g,"").trim());return isNaN(n)?null:n}
function consent(){
 app.innerHTML='<div class="card"><h1>Math Task Study</h1><p>You will answer a series of arithmetic questions on this page. Please work alone, without a calculator, phone, or scratch paper. Your answers and completion time are recorded under an anonymous ID.</p><p class="mut">Participation is voluntary and you may stop at any time.</p><div class="row"><button class="p" id="go">I consent — begin</button></div></div>';
 document.getElementById("go").onclick=function(){
  var r=load();S={id:"P"+String(r.length+1).padStart(3,"0"),cond:rnd3(),correct:0};start()};
}
function start(){S.cond===0?sharedIntro():ask(S.cond===1?EASY:HARD,0,"Warm-up",sharedIntro,false)}
function ask(set,i,title,done,timed){
 if(i>=set.length)return done();
 app.innerHTML='<div class="card"><div class="bar"><i style="width:'+(i/set.length*100)+'%"></i></div><p class="mut">'+title+' · Question '+(i+1)+' of '+set.length+'</p><div class="q">'+set[i][0]+' = ?</div><input type="text" id="a" inputmode="numeric" autocomplete="off"><div class="row"><button class="p" id="s">Submit</button>'+(timed?'<button id="x">Stop early</button>':'')+'</div></div>';
 var a=document.getElementById("a");a.focus();
 function sub(){if(a.value.trim()==="")return;
  if(timed&&parse(a.value)===set[i][1])S.correct++;
  ask(set,i+1,title,done,timed)}
 document.getElementById("s").onclick=sub;
 a.onkeydown=function(e){if(e.key==="Enter")sub()};
 if(timed)document.getElementById("x").onclick=function(){finish(false)};
}
function sharedIntro(){
 app.innerHTML='<div class="card"><h1>Main task</h1><p>Next you will answer '+SHARED.length+' questions. Answer as quickly and accurately as you can. The timer starts when you press Start.</p><div class="row"><button class="p" id="go">Start</button></div></div>';
 document.getElementById("go").onclick=function(){S.t0=performance.now();ask(SHARED,0,"Main task",function(){finish(true)},true)};
}
function finish(ok){
 var t=((performance.now()-S.t0)/1000).toFixed(2),r=load();
 r.push({id:S.id,code:S.cond,cond:LABEL[S.cond],time:t,correct:S.correct,done:ok?"Yes":"No",tech:"No"});
 save(r);
 app.innerHTML='<div class="card"><h1>Thank you!</h1><p>You have finished the task. Please let the researcher know you are done.</p><p>Your anonymous ID: <b style="font-size:1.4rem">'+S.id+'</b></p><p class="mut">Write down your ID if you want to look up your results later.</p><div class="row"><button class="p" id="n">Next participant</button></div></div>';
 document.getElementById("n").onclick=consent;
}
function csv(r){return "ID,Condition_code,Condition,Shared_time_s,Correct,Completed,Technical_issue\n"+r.map(function(x){return [x.id,x.code,x.cond,x.time,x.correct,x.done,x.tech].join(",")}).join("\n")}
var armed=false;
function data(){
 var r=load(),n=[0,0,0];r.forEach(function(x){n[x.code]++});
 var h='<div class="card"><h1>Researcher data</h1><p class="mut">Stored in this browser. Control: '+n[0]+' · Easy: '+n[1]+' · Difficult: '+n[2]+'. Correct is out of '+SHARED.length+'.</p><div class="scroll"><table><tr><th>ID</th><th>Condition</th><th>Time (s)</th><th>Correct</th><th>Done</th><th>Tech issue</th></tr>';
 r.forEach(function(x,i){h+='<tr><td>'+x.id+'</td><td>'+x.code+' · '+x.cond+'</td><td>'+x.time+'</td><td>'+x.correct+'</td><td>'+x.done+'</td><td><input type="checkbox" data-i="'+i+'"'+(x.tech==="Yes"?" checked":"")+'></td></tr>'});
 h+='</table></div><textarea id="c" readonly>'+csv(r).replace(/</g,"&lt;")+'</textarea><div class="row"><button class="p" id="cp">Copy CSV</button><button id="cl">'+(armed?"Click again to delete all":"Clear all data")+'</button><button id="bk">Back</button></div></div>';
 app.innerHTML=h;
 Array.prototype.forEach.call(app.querySelectorAll("input[type=checkbox]"),function(b){b.onchange=function(){var d=load();d[b.dataset.i].tech=b.checked?"Yes":"No";save(d);data()}});
 document.getElementById("cp").onclick=function(){var t=document.getElementById("c");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}this.textContent="Copied"};
 document.getElementById("cl").onclick=function(){if(armed){save([]);armed=false}else armed=true;data()};
 document.getElementById("bk").onclick=function(){armed=false;consent()};
}
document.getElementById("rb").onclick=data;
consent();
</script></body></html>
